<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PathQC</title>
<link rel="stylesheet" href="/web/app.css">
<script src="/web/vendor/openseadragon.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">PathQC <small id="packname"></small></div>
  <div id="imgbadge" class="badge"></div>
  <div class="grow"></div>
  <button class="chip-btn" id="reviewerBtn" title="Change reviewer">Reviewer: <b id="reviewerName">—</b></button>
  <button class="btn primary" id="saveBtn">Save results</button>
</header>

<div class="toolbar" role="toolbar">
  <div class="seg" id="modes">
    <button data-mode="pan" class="on" title="Pan and zoom; click a cell to inspect (V). Shift+drag lassos, Alt+drag subtracts.">Pan <kbd>V</kbd></button>
    <button data-mode="lasso" title="Freehand lasso around cells (L)">Lasso <kbd>L</kbd></button>
    <button data-mode="poly" title="Click the corners; double-click or Enter closes (P)">Polygon <kbd>P</kbd></button>
    <button data-mode="rect" title="Drag a rectangle (R)">Rect <kbd>R</kbd></button>
    <button data-mode="brush" title="Paint over cells; [ and ] change the size (B)">Brush <kbd>B</kbd></button>
    <button data-mode="cell" title="Click single cells (S)">Cell <kbd>S</kbd></button>
  </div>
  <span class="ctl" title="Brush radius on screen: [ smaller, ] larger. Any tool: Shift adds to the selection, Alt subtracts, Esc deselects."><b id="brushSize" class="mono">18 px</b> <kbd>[</kbd><kbd>]</kbd></span>
  <div class="seg" id="modes2">
    <button data-mode="pin" title="Click to pin a comment (C)">Comment <kbd>C</kbd></button>
    <button data-mode="area" title="Drag to draw an area and comment on it (M)">Area <kbd>M</kbd></button>
    <button data-mode="annot" title="Drag to draw a named polygon (A)">Annotate <kbd>A</kbd></button>
  </div>
  <span class="sep"></span>
  <label class="ctl">Go to <select id="secJump"></select></label>
  <label class="ctl" title="Hide cells where all three methods give the same label"><input type="checkbox" id="disagree"> Only disagreements <kbd>D</kbd></label>
  <label class="ctl"><input type="checkbox" id="showOps" checked> Edit outlines</label>
  <label class="ctl">Dots <input type="range" id="dotSize" min="0.5" max="2.5" step="0.1" value="1"></label>
  <label class="ctl" title="Fade the slide under the label layers">Fade slide <input type="range" id="wash" min="0" max="0.9" step="0.05" value="0.55"></label>
  <span class="grow"></span>
  <button class="btn" id="undoBtn" title="Undo last edit (Ctrl+Z)">Undo</button>
</div>
<div class="toolbar assistbar" id="assistBar" hidden>
  <div class="seg" id="modes3" hidden title="Assisted selection: each tool only makes a selection; nothing changes until you confirm in the box">
    <span class="seglbl">Assist</span>
    <button data-mode="wand" title="Magic wand: click a cell; selects the connected cells with the same label in that panel (W)">Wand <kbd>W</kbd></button>
    <button data-mode="comp" title="Compartment wand: connected epithelium (PanCK) or immune (CD45) region around the clicked cell (K)">Compartment <kbd>K</kbd></button>
    <button data-mode="novae" title="Novae region: connected cells of the clicked cell's Novae domain (N)">Novae <kbd>N</kbd></button>
    <button data-mode="walker" title="Refine border of the selection (random walker): click inside, Alt+click outside (G)">Refine <kbd>G</kbd></button>
  </div>
  <span class="abopts" id="abOpts"></span>
</div>

<main class="main">
  <section class="stage">
    <div class="grid" id="grid"><div id="pop" class="pop" hidden></div></div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="side">
    <div id="cellBox" class="cellbox" hidden></div>
    <nav class="tabs" id="tabs">
      <button data-tab="edit" class="on">Edit</button>
      <button data-tab="comments">Comments <span id="nComments" class="cnt"></span></button>
      <button data-tab="annots">Annotations <span id="nAnnots" class="cnt"></span></button>
      <button data-tab="labels">Labels</button>
      <button data-tab="review" title="Disagreement hotspots, largest first (J next, Shift+J previous)">Review <span id="nReview" class="cnt"></span></button>
      <button data-tab="log">Log <span id="nOps" class="cnt"></span></button>
    </nav>
    <div class="tabbody">
      <div data-pane="edit" class="pane on" id="editPane"></div>
      <div data-pane="comments" class="pane" id="commentsPane"></div>
      <div data-pane="annots" class="pane" id="annotsPane"></div>
      <div data-pane="labels" class="pane" id="labelsPane"></div>
      <div data-pane="review" class="pane" id="reviewPane"></div>
      <div data-pane="log" class="pane" id="logPane"></div>
    </div>
  </aside>
</main>

<div id="ctx" class="ctx" hidden></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" class="toast" hidden></div>
<script src="/web/app.js"></script>
</body>
</html>
